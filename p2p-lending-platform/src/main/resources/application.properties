# ===== Server =====
server.port=8080

# ===== Database (Module 1: JDBC connectivity) =====
spring.datasource.url=jdbc:mysql://localhost:3306/p2p_lending?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Amit@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate (Module 5: JPA) =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== JSP View Resolver (Module 2: JSP) =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Logging =====
logging.level.org.springframework=INFO
logging.level.com.p2plending=DEBUG
